<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 905" width="1060" height="905" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98A3AD"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C8C4A"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .hdr  { font-size: 13.5px; font-weight: 700; }
      .fld  { font-size: 11.5px; fill: #3A4750; }
      .cap  { font-size: 11px; font-style: italic; }
      .tag  { font-size: 10.5px; letter-spacing: 0.7px; font-weight: 600; }
      .jkey { font-size: 12px; font-weight: 700; fill: #33424E; }
      .jsub { font-size: 11.5px; fill: #5A6672; }
    </style>
  </defs>

  <rect x="8" y="8" width="1044" height="889" rx="14" fill="#FFFFFF" stroke="#E3E7EB"/>

  <text x="60" y="44" font-size="21" font-weight="700" fill="#16212B">S1 · from station pass to completeness</text>
  <text x="60" y="66" font-size="12.5" fill="#6B7683">Every arrow is a join; the label is the key that carries it.</text>

  <rect x="690" y="40" width="11" height="11" rx="2" fill="#FDF1E8" stroke="#C4772F"/>
  <text x="707" y="50" font-size="11.5" fill="#5A6672">reported</text>
  <rect x="790" y="40" width="11" height="11" rx="2" fill="#EEF3FB" stroke="#3B6EA5"/>
  <text x="807" y="50" font-size="11.5" fill="#5A6672">planned</text>
  <rect x="884" y="40" width="11" height="11" rx="2" fill="#EDF7EE" stroke="#4C8C4A"/>
  <text x="901" y="50" font-size="11.5" fill="#5A6672">computed</text>
  <rect x="60" y="88" width="560" height="120" rx="9" fill="#FDF1E8" stroke="#C4772F" stroke-width="1.4"/>
  <text x="78" y="112" class="mono hdr" fill="#8A4B12">1 · cds-cadip-acquisition-pass-status</text>
  <text x="602" y="112" class="tag" fill="#C4772F" text-anchor="end">REPORTED</text>
  <text x="78" y="136" class="mono fld">session_id · satellite_id · downlink_orbit · ground_station</text>
  <text x="78" y="155" class="mono fld">downlink_start → downlink_stop → delivery_stop</text>
  <text x="78" y="174" class="mono fld">global_status · quality_infos summed over channels</text>
  <text x="78" y="196" class="cap" fill="#8A6B52">one CADIP session = what the station really received and delivered</text>
  <line x1="340" y1="208" x2="340" y2="284" stroke="#98A3AD" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="358" y="228" class="mono jkey">CORRELATE_ACQUISITIONS</text>
  <text x="358" y="246" class="mono jsub">satellite_id = satellite_unit · downlink_orbit = downlink_absolute_orbit</text>
  <text x="358" y="264" class="mono jsub">ground_station found inside station → writes delivery_stop</text>
  <rect x="60" y="286" width="560" height="120" rx="9" fill="#EEF3FB" stroke="#3B6EA5" stroke-width="1.4"/>
  <text x="78" y="310" class="mono hdr" fill="#1F4E79">2 · cds-downlink-datatake</text>
  <text x="602" y="310" class="tag" fill="#3B6EA5" text-anchor="end">PLANNED</text>
  <text x="78" y="334" class="mono fld">datatake_id · satellite_unit · station · channel · session_id</text>
  <text x="78" y="353" class="mono fld">effective_downlink_start / stop · downlink_duration · partial</text>
  <text x="78" y="372" class="mono fld">+ delivery_stop (from 1) · + observation_time_start (from 3)</text>
  <text x="78" y="394" class="cap" fill="#4E6B8A">one planned downlink pass — a datatake usually needs several</text>
  <line x1="340" y1="406" x2="340" y2="464" stroke="#98A3AD" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="358" y="426" class="mono jkey">satellite_unit + datatake_id</text>
  <text x="358" y="444" class="mono jsub">one datatake → N downlink rows (station × channel)</text>
  <rect x="60" y="466" width="560" height="101" rx="9" fill="#EEF3FB" stroke="#3B6EA5" stroke-width="1.4"/>
  <text x="78" y="490" class="mono hdr" fill="#1F4E79">3 · cds-datatake</text>
  <text x="232" y="490" class="mono" font-size="12" fill="#3B6EA5">_id = S1A-337854</text>
  <text x="602" y="490" class="tag" fill="#3B6EA5" text-anchor="end">PLANNED</text>
  <text x="78" y="514" class="mono fld">observation_time_start / stop · observation_duration</text>
  <text x="78" y="533" class="mono fld">l0_sensing_duration · instrument_mode · timeliness · orbits</text>
  <text x="78" y="555" class="cap" fill="#4E6B8A">the observation as planned — this is the EXPECTED reference</text>
  <line x1="622" y1="522" x2="656" y2="522" stroke="#4C8C4A" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <rect x="660" y="466" width="340" height="106" rx="9" fill="#EDF7EE" stroke="#4C8C4A" stroke-width="1.3"/>
  <text x="678" y="490" font-size="12.5" font-weight="700" fill="#2E6B2C">completeness · cds-datatake</text>
  <text x="678" y="512" class="mono" font-size="11" fill="#2E6B2C">expected = l0_sensing_duration</text>
  <text x="678" y="529" class="mono" font-size="11" fill="#2E6B2C">value    = Σ product sensing (union)</text>
  <text x="678" y="546" class="mono" font-size="11" fill="#2E6B2C">% = value / expected × 100</text>
  <text x="678" y="563" class="mono" font-size="11" fill="#2E6B2C">stored as IW_RAW__0S_local_*</text>
  <line x1="340" y1="645" x2="340" y2="569" stroke="#98A3AD" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="358" y="587" class="mono jkey">datatake_id decoded from the product name</text>
  <text x="358" y="605" class="mono jsub">key = {satellite_unit}-{datatake_id} → the cds-datatake _id</text>
  <text x="358" y="623" class="mono jsub">COMPUTE_COMPLETENESS sums the sensing of all its products</text>
  <rect x="60" y="645" width="560" height="101" rx="9" fill="#FDF1E8" stroke="#C4772F" stroke-width="1.4"/>
  <text x="78" y="669" class="mono hdr" fill="#8A4B12">4 · cds-product</text>
  <text x="602" y="669" class="tag" fill="#C4772F" text-anchor="end">REPORTED</text>
  <text x="78" y="693" class="mono fld">name · product_type · sensing_start_date / end</text>
  <text x="78" y="712" class="mono fld">datatake_id (decimal) · hex_datatake_id · prip_publication_date</text>
  <text x="78" y="734" class="cap" fill="#8A6B52">one product as delivered by the PRIP</text>
  <rect x="660" y="645" width="340" height="106" rx="9" fill="#F7F8FA" stroke="#C2CAD2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="678" y="669" font-size="12.5" font-weight="700" fill="#5A6672">also</text>
  <text x="678" y="691" class="mono" font-size="11" fill="#5A6672">cds-publication has the same</text>
  <text x="678" y="708" class="mono" font-size="11" fill="#5A6672">datatake_id + service_type/id</text>
  <text x="678" y="725" class="mono" font-size="11" fill="#5A6672">→ cds-completeness (v2): one</text>
  <text x="678" y="742" class="mono" font-size="11" fill="#5A6672">document per interface</text>
  <rect x="60" y="770" width="940" height="111" rx="9" fill="#FAFBFC" stroke="#E3E7EB"/>
  <text x="78" y="792" font-size="11" font-weight="700" fill="#5A6672" letter-spacing="0.4">WHERE THAT datatake_id COMES FROM — THE S1 PRODUCT NAME</text>
  <rect x="78" y="802" width="70" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="113" y="821" class="mono" font-size="13" fill="#16212B" text-anchor="middle">S1A</text>
  <text x="113" y="843" font-size="10" fill="#6B7683" text-anchor="middle">satellite</text>
  <rect x="152" y="802" width="140" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="222" y="821" class="mono" font-size="13" fill="#16212B" text-anchor="middle">IW_RAW__0SDV</text>
  <text x="222" y="843" font-size="10" fill="#6B7683" text-anchor="middle">product type</text>
  <rect x="296" y="802" width="170" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="381" y="821" class="mono" font-size="13" fill="#16212B" text-anchor="middle">20220511T165446</text>
  <text x="381" y="843" font-size="10" fill="#6B7683" text-anchor="middle">sensing start</text>
  <rect x="470" y="802" width="170" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="555" y="821" class="mono" font-size="13" fill="#16212B" text-anchor="middle">20220511T165518</text>
  <text x="555" y="843" font-size="10" fill="#6B7683" text-anchor="middle">sensing stop</text>
  <rect x="644" y="802" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="694" y="821" class="mono" font-size="13" fill="#16212B" text-anchor="middle">043166</text>
  <text x="694" y="843" font-size="10" fill="#6B7683" text-anchor="middle">absolute orbit</text>
  <rect x="748" y="802" width="100" height="28" rx="4" fill="#FCE9D8" stroke="#C4772F" stroke-width="1.5"/>
  <text x="798" y="821" class="mono" font-size="13" fill="#8A4B12" font-weight="700" text-anchor="middle">0527BE</text>
  <text x="798" y="843" font-size="10" fill="#8A4B12" font-weight="700" text-anchor="middle">datatake id (hex)</text>
  <rect x="852" y="802" width="120" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="912" y="821" class="mono" font-size="13" fill="#16212B" text-anchor="middle">A2C4.SAFE</text>
  <text x="912" y="843" font-size="10" fill="#6B7683" text-anchor="middle">crc · extension</text>
  <line x1="798" y1="848" x2="798" y2="854" stroke="#C4772F" stroke-width="1.4"/>
  <text x="798" y="867" font-size="11" font-weight="600" fill="#8A4B12" text-anchor="middle">0527BE → 337854 → cds-datatake _id = S1A-337854</text>
</svg>
