<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 924" width="1060" height="924" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98A3AD"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C8C4A"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .hdr  { font-size: 13.5px; font-weight: 700; }
      .fld  { font-size: 11.5px; fill: #3A4750; }
      .cap  { font-size: 11px; font-style: italic; }
      .tag  { font-size: 10.5px; letter-spacing: 0.7px; font-weight: 600; }
      .jkey { font-size: 12px; font-weight: 700; fill: #33424E; }
      .jsub { font-size: 11.5px; fill: #5A6672; }
    </style>
  </defs>

  <rect x="8" y="8" width="1044" height="908" rx="14" fill="#FFFFFF" stroke="#E3E7EB"/>

  <text x="60" y="44" font-size="21" font-weight="700" fill="#16212B">S3 · from station pass to completeness</text>
  <text x="60" y="66" font-size="12.5" fill="#6B7683">No mission plan, no datatake: the orbit is rebuilt from the product name.</text>

  <rect x="690" y="40" width="11" height="11" rx="2" fill="#FDF1E8" stroke="#C4772F"/>
  <text x="707" y="50" font-size="11.5" fill="#5A6672">reported</text>
  <rect x="790" y="40" width="11" height="11" rx="2" fill="#EEF3FB" stroke="#3B6EA5"/>
  <text x="807" y="50" font-size="11.5" fill="#5A6672">planned</text>
  <rect x="884" y="40" width="11" height="11" rx="2" fill="#EDF7EE" stroke="#4C8C4A"/>
  <text x="901" y="50" font-size="11.5" fill="#5A6672">computed</text>
  <rect x="60" y="88" width="560" height="120" rx="9" fill="#FDF1E8" stroke="#C4772F" stroke-width="1.4"/>
  <text x="78" y="112" class="mono hdr" fill="#8A4B12">1 · cds-cadip-acquisition-pass-status</text>
  <text x="602" y="112" class="tag" fill="#C4772F" text-anchor="end">REPORTED</text>
  <text x="78" y="136" class="mono fld">session_id · satellite_id · downlink_orbit · ground_station</text>
  <text x="78" y="155" class="mono fld">downlink_start → downlink_stop → delivery_stop</text>
  <text x="78" y="174" class="mono fld">global_status · from_acq_delivery_timeliness</text>
  <text x="78" y="196" class="cap" fill="#8A6B52">S3 is received at the same CADIP stations as S1 and S2</text>
  <line x1="340" y1="208" x2="340" y2="266" stroke="#98A3AD" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="358" y="228" class="mono jkey">the chain STOPS here for S3</text>
  <text x="358" y="246" class="mono jsub">MP_ALL / MP_ACQ are collected for S1 and S2 only</text>
  <rect x="60" y="268" width="560" height="101" rx="9" fill="#F7F8FA" stroke="#C2CAD2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="78" y="292" class="mono hdr" fill="#5A6672">cds-downlink-datatake · cds-datatake</text>
  <text x="602" y="292" class="tag" fill="#C2CAD2" text-anchor="end">NOT USED FOR S3</text>
  <text x="78" y="316" class="mono fld">no MP_ALL row → no planned downlink document</text>
  <text x="78" y="335" class="mono fld">no MP_ACQ row → no planned observation document</text>
  <text x="78" y="357" class="cap" fill="#6B7683">acquisition timeliness stays on box 1, never joined to an observation</text>
  <line x1="340" y1="369" x2="340" y2="445" stroke="#98A3AD" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="358" y="389" class="mono jkey">so the observation is rebuilt from the product itself</text>
  <text x="358" y="407" class="mono jsub">pseudo datatake_id = {satellite}-{cycle}-{relative_orbit}</text>
  <text x="358" y="425" class="mono jsub">parsed out of the instance-ID field of the product name</text>
  <rect x="60" y="447" width="560" height="120" rx="9" fill="#FDF1E8" stroke="#C4772F" stroke-width="1.4"/>
  <text x="78" y="471" class="mono hdr" fill="#8A4B12">3 · cds-product</text>
  <text x="218" y="471" class="mono" font-size="12" fill="#C4772F">datatake_id = S3A-079-339</text>
  <text x="602" y="471" class="tag" fill="#C4772F" text-anchor="end">REPORTED</text>
  <text x="78" y="495" class="mono fld">name · product_type · timeliness · sensing_start_date / end</text>
  <text x="78" y="514" class="mono fld">datatake_id (pseudo) · cycle_number · relative_orbit_number</text>
  <text x="78" y="533" class="mono fld">prip_service · prip_publication_date</text>
  <text x="78" y="555" class="cap" fill="#8A6B52">one product as delivered by the PRIP</text>
  <line x1="340" y1="567" x2="340" y2="643" stroke="#98A3AD" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="358" y="587" class="mono jkey">COMPUTE_S3_COMPLETENESS</text>
  <text x="358" y="605" class="mono jsub">compute key = {datatake_id}#{product_type}#{timeliness}</text>
  <text x="358" y="623" class="mono jsub">one completeness document per orbit × type × timeliness</text>
  <rect x="60" y="645" width="560" height="120" rx="9" fill="#EDF7EE" stroke="#4C8C4A" stroke-width="1.4"/>
  <text x="78" y="669" class="mono hdr" fill="#2E6B2C">4 · cds-s3-completeness</text>
  <text x="602" y="669" class="tag" fill="#4C8C4A" text-anchor="end">COMPUTED</text>
  <text x="78" y="693" class="mono fld">key = S3A-079-339#OL_0_EFR___#NR</text>
  <text x="78" y="712" class="mono fld">value · expected · value_adjusted · percentage · status</text>
  <text x="78" y="731" class="mono fld">observation_time_start / stop ← spanned by the products</text>
  <text x="78" y="753" class="cap" fill="#436B45">the completeness document is created by the products, not by a plan</text>
  <line x1="622" y1="701" x2="656" y2="701" stroke="#4C8C4A" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <rect x="660" y="645" width="340" height="106" rx="9" fill="#EDF7EE" stroke="#4C8C4A" stroke-width="1.3"/>
  <text x="678" y="669" font-size="12.5" font-weight="700" fill="#2E6B2C">expected · per orbit</text>
  <text x="678" y="691" class="mono" font-size="11" fill="#2E6B2C">44 min  → OLCI · SYN types</text>
  <text x="678" y="708" class="mono" font-size="11" fill="#2E6B2C">101 min → MWR · SLSTR · SRAL ·</text>
  <text x="678" y="725" class="mono" font-size="11" fill="#2E6B2C">          GNSS · DORIS · TM</text>
  <text x="678" y="742" class="mono" font-size="11" fill="#2E6B2C">static table in CdsS3Completeness</text>
  <rect x="60" y="789" width="940" height="111" rx="9" fill="#FAFBFC" stroke="#E3E7EB"/>
  <text x="78" y="811" font-size="11" font-weight="700" fill="#5A6672" letter-spacing="0.4">WHERE THAT PSEUDO datatake_id COMES FROM — THE S3 PRODUCT NAME</text>
  <rect x="78" y="821" width="70" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="113" y="840" class="mono" font-size="13" fill="#16212B" text-anchor="middle">S3A</text>
  <text x="113" y="862" font-size="10" fill="#6B7683" text-anchor="middle">satellite</text>
  <rect x="152" y="821" width="150" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="227" y="840" class="mono" font-size="13" fill="#16212B" text-anchor="middle">OL_0_EFR___</text>
  <text x="227" y="862" font-size="10" fill="#6B7683" text-anchor="middle">product type</text>
  <rect x="306" y="821" width="160" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="386" y="840" class="mono" font-size="13" fill="#16212B" text-anchor="middle">20211214T154348</text>
  <text x="386" y="862" font-size="10" fill="#6B7683" text-anchor="middle">sensing start</text>
  <rect x="470" y="821" width="160" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="550" y="840" class="mono" font-size="13" fill="#16212B" text-anchor="middle">20211214T154548</text>
  <text x="550" y="862" font-size="10" fill="#6B7683" text-anchor="middle">sensing stop</text>
  <rect x="634" y="821" width="85" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="676" y="840" class="mono" font-size="13" fill="#16212B" text-anchor="middle">0119</text>
  <text x="676" y="862" font-size="10" fill="#6B7683" text-anchor="middle">duration</text>
  <rect x="723" y="821" width="75" height="28" rx="4" fill="#FCE9D8" stroke="#C4772F" stroke-width="1.5"/>
  <text x="760" y="840" class="mono" font-size="13" fill="#8A4B12" font-weight="700" text-anchor="middle">079</text>
  <text x="760" y="862" font-size="10" fill="#8A4B12" font-weight="700" text-anchor="middle">cycle</text>
  <rect x="802" y="821" width="75" height="28" rx="4" fill="#FCE9D8" stroke="#C4772F" stroke-width="1.5"/>
  <text x="839" y="840" class="mono" font-size="13" fill="#8A4B12" font-weight="700" text-anchor="middle">339</text>
  <text x="839" y="862" font-size="10" fill="#8A4B12" font-weight="700" text-anchor="middle">rel. orbit</text>
  <rect x="881" y="821" width="70" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="916" y="840" class="mono" font-size="13" fill="#16212B" text-anchor="middle">LN1</text>
  <text x="916" y="862" font-size="10" fill="#6B7683" text-anchor="middle">centre</text>
  <rect x="955" y="821" width="75" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE3" stroke-width="1.0"/>
  <text x="992" y="840" class="mono" font-size="13" fill="#16212B" text-anchor="middle">O_NR</text>
  <text x="992" y="862" font-size="10" fill="#6B7683" text-anchor="middle">timeliness</text>
  <line x1="839" y1="867" x2="839" y2="873" stroke="#C4772F" stroke-width="1.4"/>
  <text x="839" y="886" font-size="11" font-weight="600" fill="#8A4B12" text-anchor="middle">cycle + relative orbit → datatake_id = S3A-079-339</text>
</svg>
